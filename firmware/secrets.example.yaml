# Copy values into ESPHome Builder's secrets.yaml. These are examples, not working credentials.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
# Native ESPHome API: generate a fresh 32-byte base64 key in Builder.
jarvis_api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
jarvis_ota_password: "replace-with-a-long-unique-ota-password"
jarvis_server_url: "ws://192.168.1.10:8099/device"
# Obtain this token from this App's Pair device screen; keep it out of Git.
jarvis_pairing_token: "replace-with-the-app-generated-pairing-token"
