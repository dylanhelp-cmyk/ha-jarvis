# Local source-bundle fallback. Use voice-pe-repository.yaml for repository updates.
substitutions:
  name: jarvis-voice-pe
  friendly_name: Jarvis Voice PE Testbench

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret jarvis_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret jarvis_ota_password

jarvis_stream:
  server_url: !secret jarvis_server_url
  token: !secret jarvis_pairing_token

packages:
  jarvis_voice_pe: !include voice-pe-package.yaml

external_components:
  - source:
      type: local
      path: components
    components: [jarvis_stream]
