# Keep this entry and secrets.yaml in ESPHome Builder. Updates come from Git on validation/compile.
substitutions:
  name: jarvis-voice-pe
  friendly_name: Jarvis Voice PE Testbench

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret jarvis_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret jarvis_ota_password

jarvis_stream:
  server_url: !secret jarvis_server_url
  token: !secret jarvis_pairing_token

packages:
  jarvis_voice_pe:
    url: https://github.com/dylanhelp-cmyk/ha-jarvis
    ref: main
    files: [ha_jarvis/firmware/voice-pe-package.yaml]
    refresh: 5min

external_components:
  - source:
      type: git
      url: https://github.com/dylanhelp-cmyk/ha-jarvis
      ref: main
      path: ha_jarvis/firmware/components
    components: [jarvis_stream]
    refresh: 5min

