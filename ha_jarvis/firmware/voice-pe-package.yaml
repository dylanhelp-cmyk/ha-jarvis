# Secret-free repository package. Device credentials belong in the local entry.
substitutions:
  name: jarvis-voice-pe
  friendly_name: Jarvis Voice PE Testbench

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  project:
    name: jarvis.voice_pe_testbench
    version: "0.1.2"
  on_boot:
    priority: -100
    then:
      - lambda: id(pcm_stream).set_muted(id(hardware_mute).state || id(software_mute).state);
      - micro_wake_word.start:

packages:
  # Hardware-only derivative of the official configuration at this immutable revision.
  voice_pe_hardware: !include voice-pe-hardware.yaml


logger:
  level: INFO

external_components:
  - source:
      type: git
      url: https://github.com/esphome/home-assistant-voice-pe
      ref: d4e6fa43d6a1a7d342b7d4d403567e06516719de
    components: [voice_kit]
    refresh: never

jarvis_stream:
  id: pcm_stream
  i2c_id: internal_i2c
  device_id: ${name}
  microphone:
    microphone: i2s_mics
    channels: [0]
    bits_per_sample: 16
    gain_factor: 1

micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: [1]
    gain_factor: 4
  stop_after_detection: false
  models:
    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/hey_jarvis.json
      id: hey_jarvis
  on_wake_word_detected:
    - if:
        condition:
          lambda: return !id(hardware_mute).state && !id(software_mute).state;
        then:
          - lambda: id(pcm_stream).wake_word(wake_word);
          - light.turn_on:
              id: status_ring
              red: 0%
              green: 100%
              blue: 20%
              brightness: 35%
          - delay: 300ms

binary_sensor:
  - platform: gpio
    id: hardware_mute
    name: Hardware microphone mute
    pin: GPIO3
    on_state:
      - lambda: id(pcm_stream).set_muted(x || id(software_mute).state);
  - platform: gpio
    name: Center button
    id: center_button
    pin:
      number: GPIO0
      inverted: true
    on_press:
      # Physical stop is always available; this button never begins a recording.
      - lambda: id(pcm_stream).set_muted(true);
      - switch.turn_on: software_mute

switch:
  - platform: template
    id: software_mute
    name: Microphone mute
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(pcm_stream).set_muted(true);
      - microphone.mute: i2s_mics
    on_turn_off:
      - lambda: id(pcm_stream).set_muted(id(hardware_mute).state);
      - microphone.unmute: i2s_mics

interval:
  - interval: 500ms
    then:
      - lambda: |-
          auto call = id(status_ring).turn_on();
          call.set_brightness(0.25f);
          if (id(hardware_mute).state || id(software_mute).state) call.set_rgb(1.0f, 0.0f, 0.0f);
          else if (id(pcm_stream).is_capturing()) call.set_rgb(0.0f, 0.4f, 1.0f);
          else if (id(pcm_stream).is_ready()) call.set_rgb(0.1f, 0.1f, 0.1f);
          else call.set_rgb(1.0f, 0.35f, 0.0f);
          call.perform();

button:
  - platform: restart
    name: Restart
    entity_category: config
